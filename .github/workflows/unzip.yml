name: Unzip Code and Commit to Main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Unzip code.zip
        run: |
          if [ -f "code.zip" ]; then
            echo "Extracting code.zip..."
            unzip -o code.zip -d .
            rm -f code.zip
          else
            echo "Error: code.zip not found in the repository root!"
            exit 1
          fi

      - name: Commit and push extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes detected after unzipping."
          else
            git commit -m "Unzip code.zip and push extracted files [skip ci]"
            git push origin main
          fi
